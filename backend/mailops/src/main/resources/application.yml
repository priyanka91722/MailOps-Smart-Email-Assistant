server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: mailops-api
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
            temperature: 0.3
            max-output-tokens: 900

mailops:
  cors:
    allowed-origins: ${MAILOPS_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
